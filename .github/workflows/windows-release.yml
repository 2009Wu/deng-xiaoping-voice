name: Publish Windows release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/windows-release.yml', 'releases/windows.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Build and publish Windows ZIP
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 "https://github.com/$GITHUB_REPOSITORY.git" source
          test "$(git -C source rev-parse HEAD)" = "$GITHUB_SHA"
          tag=$(python3 -c 'import json; print(json.load(open("source/releases/windows.json"))["tag"])')
          title=$(python3 -c 'import json; print(json.load(open("source/releases/windows.json"))["title"])')
          [[ "$tag" =~ ^v[0-9]+.[0-9]+.[0-9]+$ ]]
          python3 source/windows/package_release.py --output-dir dist
          cat dist/Deng-Xiaoping-Voice-Studio-Windows.zip.sha256 >> "$GITHUB_STEP_SUMMARY"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --draft --title "$title" --notes-file "source/docs/releases/$tag.md" --repo "$GITHUB_REPOSITORY"
          fi
          if [[ $(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft) != true ]]; then
            echo "Release already published."
            exit 0
          fi
          gh release upload "$tag" dist/*.zip dist/*.zip.sha256 --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$tag" --draft=false --latest --repo "$GITHUB_REPOSITORY"
